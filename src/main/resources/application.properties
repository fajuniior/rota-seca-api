spring.application.name=rota-seca-api
# O Render informa a porta pela variável PORT; localmente usa 8080
server.port=${PORT:8080}
# Datas em JSON no formato 2026-02-16T15:30:00
spring.jackson.time-zone=America/Sao_Paulo
# Permite omitir campos numéricos no JSON (ex.: o ID, que a API gera sozinha)
spring.jackson.deserialization.fail-on-null-for-primitives=false
